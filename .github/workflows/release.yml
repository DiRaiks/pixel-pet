name: Release

# A version tag (v0.2.0, v0.3.0-beta.1) builds a DMG and publishes it as a GitHub release.
# With the Developer ID and notary secrets set, the app and DMG are signed, notarized and stapled.
# Without them it's a dry run: ad-hoc signed, published as a draft prerelease.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    name: Build and publish
    runs-on: macos-26
    timeout-minutes: 60
    env:
      P12: ${{ secrets.DEVELOPER_ID_P12 }}
      P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
      API_KEY: ${{ secrets.APPLE_API_KEY }}
      NOTARY_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      NOTARY_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # git describe for CFBundleVersion

      - name: Import the Developer ID certificate
        if: env.P12 != ''
        run: |
          KC="$RUNNER_TEMP/release.keychain-db"
          KC_PASS="$(uuidgen)"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PASS" "$KC" > /dev/null
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          ID="$(security find-identity -v -p codesigning "$KC" | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -1)"
          test -n "$ID" || { echo "no Developer ID Application identity in the certificate" >&2; exit 1; }
          echo "SIGN_IDENTITY=$ID" >> "$GITHUB_ENV"
          echo "RELEASE_KEYCHAIN=$KC" >> "$GITHUB_ENV"

      - name: Notary API key
        if: env.P12 != '' && env.API_KEY != ''
        run: |
          echo "$API_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          echo "NOTARY_KEY=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"

      - name: Build the DMG
        run: ./scripts/release.sh "$GITHUB_REF_NAME"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          set -- "$GITHUB_REF_NAME" "build/PixelPet-$VERSION.dmg" --title "Pixel Pet $VERSION" --generate-notes
          case "$VERSION" in *-*) set -- "$@" --prerelease ;; esac
          if [ -z "${SIGN_IDENTITY:-}" ]; then
            set -- "$@" --draft --prerelease --notes "Dry run: signed ad-hoc and not notarized; macOS will block it."
          fi
          gh release create "$@"

      - name: Clean up
        if: always()
        run: |
          if [ -n "${RELEASE_KEYCHAIN:-}" ]; then security delete-keychain "$RELEASE_KEYCHAIN" || true; fi
          rm -f "$RUNNER_TEMP/notary.p8"
