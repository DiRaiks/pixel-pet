<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pixel Pet sprites</title>
<style>
:root{--bg:#fafaf7;--card:#f1efe8;--tx:#1f1e1d;--mu:#888780;--ac:#e6f1fb;--act:#185fa5}
@media (prefers-color-scheme:dark){:root{--bg:#1f1e1d;--card:#2c2c2a;--tx:#f1efe8;--mu:#888780;--ac:#0c447c;--act:#b5d4f4}}
body{margin:0;padding:24px 16px;background:var(--bg);color:var(--tx);font:14px/1.5 -apple-system,system-ui,sans-serif}
.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;max-width:960px}
.st{background:var(--card);border-radius:12px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:4px}
.st canvas{image-rendering:pixelated;width:128px;height:128px;border-radius:6px}
.n{font-size:13px;text-align:center}.m{font-size:11px;color:var(--mu)}
.sc{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 12px;max-width:960px}
button{font:inherit;padding:6px 12px;border-radius:8px;border:1px solid var(--mu);background:transparent;color:var(--tx);cursor:pointer}
button.on{background:var(--ac);color:var(--act)}
</style></head><body>
<div class="sc"><button id="s1" class="on">1×</button><button id="s4">0.25×</button><button id="pp">Пауза</button><button id="nx">Кадр →</button><span class="m" id="tot" style="margin-left:auto"></span></div>
<div class="sg" id="grid"></div>
<script>
// Procedural sprite prototype: 32x32 logical pixels, 11 states. Reference for the Swift renderer (M1).
const dark=matchMedia('(prefers-color-scheme: dark)').matches;
const P={bg:dark?'#2C2C2A':'#F1EFE8',o:dark?'#121211':'#26215C',f:'#7F77DD',hi:'#AFA9EC',sd:'#534AB7',em:'#EEEDFE',eye:'#26215C',gl:'#ffffff',sh:dark?'#444441':'#D3D1C7'};
const AM='#EF9F27',TE='#1D9E75',TL='#9FE1CB',RD='#E24B4A';
const p=(c,x,y,k)=>{c.fillStyle=k;c.fillRect(x,y,1,1)};
const r=(c,x,y,w,h,k)=>{c.fillStyle=k;c.fillRect(x,y,w,h)};
function eyes(c,cx,ey,t){
 const L=cx-4,R=cx+2,T=[cx-5,cx+2];
 const two=f=>{f(L);f(R)};
 if(t=='open')two(x=>{r(c,x,ey,2,3,P.eye);p(c,x,ey,P.gl)});
 else if(t=='half')two(x=>r(c,x,ey+1,2,2,P.eye));
 else if(t=='blink')two(x=>r(c,x,ey+2,2,1,P.eye));
 else if(t=='wide')T.forEach(x=>{r(c,x,ey-1,3,4,P.eye);p(c,x,ey-1,P.gl)});
 else if(t=='happy')T.forEach(x=>{p(c,x,ey+2,P.eye);p(c,x+1,ey+1,P.eye);p(c,x+2,ey+2,P.eye)});
 else if(t=='closed')T.forEach(x=>{p(c,x,ey+1,P.eye);p(c,x+1,ey+2,P.eye);p(c,x+2,ey+1,P.eye)});
 else if(t=='worry'){two(x=>{r(c,x,ey+1,2,2,P.eye);p(c,x,ey+1,P.gl)});p(c,L,ey-1,P.eye);p(c,L+1,ey-2,P.eye);p(c,R,ey-2,P.eye);p(c,R+1,ey-1,P.eye)}
 else if(t=='x')T.forEach(x=>{p(c,x,ey,P.eye);p(c,x+2,ey,P.eye);p(c,x+1,ey+1,P.eye);p(c,x,ey+2,P.eye);p(c,x+2,ey+2,P.eye)});
 else if(t=='glow')two(x=>r(c,x,ey,2,2,P.em));
 else if(t=='glowb')two(x=>r(c,x,ey+1,2,1,P.em));
}
function mouth(c,cx,y,t){
 if(t=='flat')r(c,cx-1,y,2,1,P.eye);
 else if(t=='smile'){p(c,cx-2,y,P.eye);r(c,cx-1,y+1,2,1,P.eye);p(c,cx+1,y,P.eye)}
 else if(t=='o')r(c,cx-1,y,2,2,P.eye);
 else if(t=='wobble'){p(c,cx-2,y+1,P.eye);p(c,cx-1,y,P.eye);p(c,cx,y+1,P.eye);p(c,cx+1,y,P.eye)}
}
function scene(c,o){
 o=Object.assign({w:16,h:14,dx:0,dy:0,cx:16,by:26,ground:27,eye:'open',mouth:'flat',lx:0,ly:0,drain:0,shadow:true},o);
 const cx=o.cx+o.dx,by=o.by+o.dy,w=o.w,h=o.h,x0=cx-w/2,y0=by-h;
 const F=o.fill||P.f,HI=o.hi||P.hi,SD=o.sd||P.sd;
 if(o.shadow){const sw=Math.max(4,w-2-Math.round((o.ground-1-by)/1.5));r(c,o.cx+o.dx-sw/2,o.ground,sw,1,P.sh)}
 for(let y=0;y<h;y++)for(let x=0;x<w;x++){
  const cX=(x==0||x==w-1),cY=(y==0||y==h-1);
  if(cX&&cY)continue;
  const edge=cX||cY||((x==1||x==w-2)&&(y==1||y==h-2));
  const k=edge?P.o:(y<=o.drain?P.em:(y==h-2?SD:((y==2&&x>=2&&x<=4)||(x==2&&y==3)?HI:F)));
  p(c,x0+x,y0+y,k);
 }
 const ey=y0+Math.max(3,Math.round(h*0.3))+o.ly;
 eyes(c,cx+o.lx,ey,o.eye);mouth(c,cx+o.lx,ey+4,o.mouth);
 return{x0,y0,cx,ey};
}
function cube(c,x,y,k,s){r(c,x,y,3,3,k);if(s!=null){const R=[[0,0],[1,0],[2,0],[2,1],[2,2],[1,2],[0,2],[0,1]][s%8];p(c,x+R[0],y+R[1],TL)}}
function spark(c,x,y,k,big){p(c,x,y,k);if(big){p(c,x-1,y,k);p(c,x+1,y,k);p(c,x,y-1,k);p(c,x,y+1,k)}}
function zz(c,x,y,k){r(c,x,y,3,1,k);p(c,x+1,y+1,k);r(c,x,y+2,3,1,k)}
// [width, height, dy] keyframes: anticipation -> stretch -> airborne -> land squash -> settle
const HOP=[[16,14,0],[18,13,0],[18,11,0],[14,16,-1],[14,17,-4],[14,16,-7],[14,15,-8],[14,15,-8],[14,16,-6],[14,17,-3],[20,10,0],[18,12,0],[16,15,0],[16,14,0]];
const JMP=[[16,14,0],[18,12,0],[20,10,0],[14,17,-3],[14,17,-7],[14,16,-10],[14,15,-11],[14,15,-11],[14,16,-9],[14,17,-5],[14,16,-1],[20,10,0],[18,12,0],[16,15,0],[16,14,0],[16,14,0]];
const S=[
{id:'idle',n:'Покой',N:24,fps:8,f:(c,i)=>{const b=(i>=4&&i<=8)||(i>=16&&i<=19)?1:0;scene(c,{h:14+b,eye:i==10||i==12?'half':i==11?'blink':'open',lx:i>=18&&i<=21?-1:0})}},
{id:'hop',n:'Прыжок',N:14,fps:14,f:(c,i)=>{const[w,h,dy]=HOP[i];scene(c,{w,h,dy,eye:i==1||i==2?'half':i==10?'blink':'open',ly:dy<-2?-1:0,mouth:dy<0?'o':'flat'})}},
{id:'working',n:'Агенты работают',N:12,fps:10,f:(c,i)=>{const s=scene(c,{cx:13,h:Math.floor(i/2)%2?13:14,eye:'half',lx:1,ly:-1});const a=Math.floor(i/3)%4;for(let k=0;k<3;k++)r(c,s.cx-3+k*3,s.y0-3-(k==a?1:0),1,1,P.sd);cube(c,25,24,TE,i);cube(c,25,20,TE,i+4)}},
{id:'alert',n:'Агент ждёт ввода',N:12,fps:12,f:(c,i)=>{const D=[0,0,-1,-2,-3,-2,-1,0,0,0,0,0];const s=scene(c,{cx:14,dy:D[i],w:i==7?18:16,h:i==7?12:14,eye:'wide',lx:1,mouth:'o'});if(i%6<4){r(c,s.cx-1,s.y0-7,2,3,AM);r(c,s.cx-1,s.y0-3,2,1,AM)}const cy=24-((i+6)%12<3?1:0);cube(c,26,cy,AM);if(i%4<2)p(c,27,cy+1,'#412402')}},
{id:'celebrate',n:'Задача готова',N:16,fps:12,f:(c,i)=>{const[w,h,dy]=JMP[i];scene(c,{w,h,dy,eye:i>=3&&i<=12?'happy':'open',mouth:'smile'});if(i>=5&&i<=14){const q=i-4;[[-q-2,-q/2],[q+2,-q/2],[-q,q/3-6],[q,q/3-6]].forEach(([x,y],k)=>spark(c,16+Math.round(x),12+Math.round(y),k%2?AM:TE,q<6))}}},
{id:'sleep',n:'Сон',N:24,fps:6,f:(c,i)=>{const b=i<12?0:1;scene(c,{w:16+2*b,h:14-b,eye:'closed',mouth:b?'o':'none'});[0,12].forEach(k=>{const f=(i+k)%24;if(f<16)zz(c,23+Math.floor(f/4),9-Math.floor(f/2),f<8?P.sd:P.hi)})}},
{id:'lowLimit',n:'Лимит на исходе',N:16,fps:10,f:(c,i)=>{const s=scene(c,{w:14,h:13,dx:i<6&&i%2?1:0,eye:'worry',mouth:'wobble',drain:6});const y=s.y0+2+Math.floor(i/2);if(y<s.y0+12){p(c,s.x0+14,y,'#85B7EB');p(c,s.x0+14,y+1,'#378ADD')}}},
{id:'error',n:'Ошибка',N:12,fps:14,f:(c,i)=>{const X=[0,-2,2,-2,2,-1,1,0,0,0,0,0];const red=i>=1&&i<=5;scene(c,{cx:14,dx:X[i],eye:'x',mouth:'wobble',fill:red?RD:null,hi:red?'#F09595':null,sd:red?'#A32D2D':null});cube(c,26,24,RD);if(i%4<2)p(c,27,25,'#501313')}},
{id:'peek',n:'Из чёлки',N:28,fps:12,f:(c,i)=>{let by=6;if(i>=6&&i<=11){const e=1-Math.pow(1-(i-5)/6,3);by=6+Math.round(10*e)}else if(i>=12&&i<=21)by=16;else if(i>=22&&i<=24)by=16-Math.round(10*(i-21)/3);const lx=i>=13&&i<=16?-1:i>=17&&i<=20?1:0;scene(c,{by,shadow:false,lx,eye:i==21?'blink':'open'});r(c,5,0,22,5,'#000');r(c,6,5,20,1,'#000');r(c,0,0,5,2,P.sh);r(c,27,0,5,2,P.sh);if(by<=8)eyes(c,16,1,i==3||i==26?'glowb':'glow')}},
{id:'dragged',n:'Вытащили мышью',N:16,fps:10,f:(c,i)=>{const L=i<10?[14,17,23]:[[14,16,25],[20,10,26],[18,12,26],[16,15,26],[16,14,26],[16,14,26]][i-10];const dx=i<10?Math.round(Math.sin(i/10*Math.PI*2)*1.4):0;const s=scene(c,{w:L[0],h:L[1],by:L[2],dx,eye:i<10?'wide':i==11?'blink':'open',mouth:i<11?'o':'flat'});if(i<10){const hx=s.cx+1,hy=s.y0-4;['1   ','11  ','121 ','1221','11  '].forEach((row,y)=>[...row].forEach((ch,x)=>{if(ch!=' ')p(c,hx+x,hy+y,ch=='1'?P.o:'#fff')}))}}},
{id:'talk',n:'Отвечает',N:8,fps:10,f:(c,i)=>{scene(c,{cx:11,w:14,eye:i==6?'blink':'open',lx:1,mouth:['o','flat','smile','flat','o','flat','flat','smile'][i]});r(c,19,6,12,9,P.o);r(c,20,7,10,7,'#fff');p(c,19,15,P.o);p(c,18,16,P.o);p(c,20,14,'#fff');const a=Math.min(7,(i+1)*2),b=Math.max(0,Math.min(5,(i-2)*2));r(c,21,9,a,1,P.sd);if(b)r(c,21,11,b,1,P.sd)}}
];
const grid=document.getElementById('grid');
const T=S.map(s=>{const d=document.createElement('div');d.className='st';d.innerHTML=`<canvas width="32" height="32"></canvas><span class="n">${s.n} <span class="m">(${s.id})</span></span><span class="m"></span>`;grid.appendChild(d);return{s,c:d.querySelector('canvas').getContext('2d'),m:d.querySelectorAll('.m')[1],f:0,acc:0,dirty:true}});
document.getElementById('tot').textContent='Всего кадров: '+S.reduce((a,s)=>a+s.N,0);
let speed=1,paused=false,last=performance.now();
function render(t){r(t.c,0,0,32,32,P.bg);t.s.f(t.c,t.f);t.m.textContent=`кадр ${t.f+1}/${t.s.N} · ${t.s.fps} fps`;t.dirty=false}
function loop(now){const dt=Math.min(100,now-last);last=now;T.forEach(t=>{if(!paused){t.acc+=dt*speed;const fr=1000/t.s.fps;while(t.acc>=fr){t.acc-=fr;t.f=(t.f+1)%t.s.N;t.dirty=true}}if(t.dirty)render(t)});requestAnimationFrame(loop)}
requestAnimationFrame(loop);
const $=id=>document.getElementById(id);
$('s1').onclick=()=>{speed=1;$('s1').classList.add('on');$('s4').classList.remove('on')};
$('s4').onclick=()=>{speed=0.25;$('s4').classList.add('on');$('s1').classList.remove('on')};
$('pp').onclick=()=>{paused=!paused;$('pp').textContent=paused?'Играть':'Пауза'};
$('nx').onclick=()=>{paused=true;$('pp').textContent='Играть';T.forEach(t=>{t.f=(t.f+1)%t.s.N;t.dirty=true})};
</script></body></html>
