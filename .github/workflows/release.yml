name: Release

# A version tag (v0.2.0, v0.3.0-beta.1) builds a DMG and publishes it as a GitHub release.
# With the Developer ID and notary secrets set, the app and DMG are signed, notarized and stapled.
# Without them it's a dry run: ad-hoc signed, published as a draft prerelease.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    name: Build and publish
    runs-on: macos-26
    timeout-minutes: 60
    # The signing and notary secrets live in the "release" environment, which only v* tags may use:
    # no branch, pull request or other workflow can read them.
    environment: release
    # Secrets go only to the steps that use them, not to the build of the repository's code. Whether
    # signing is set up at all is known from these two flags.
    env:
      HAS_P12: ${{ secrets.DEVELOPER_ID_P12 != '' }}
      HAS_API_KEY: ${{ secrets.APPLE_API_KEY != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # git describe for CFBundleVersion

      # A release needs a tag signed by the maintainer's YubiKey: a stolen token can push tags but can't
      # sign them. GitHub checks the signature against the account's keys; the fingerprint has to be one of
      # the two signing subkeys below (one per YubiKey), so a key added to the account later doesn't pass.
      # "Signed main" keeps this file from being changed without a signed commit.
      - name: Check the tag is signed by the maintainer
        env:
          GH_TOKEN: ${{ github.token }}
          ALLOWED: 1F85AEBC13649251888F56BE755181A1350D84EE 9AA713432AED3152389A9D5B77E8A5FD032568A4
        run: |
          git fetch --force --no-tags origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          object="$(git rev-parse "refs/tags/$GITHUB_REF_NAME")"
          if [ "$(git cat-file -t "$object")" != tag ]; then
            echo "::error::$GITHUB_REF_NAME is a lightweight tag; sign it: git tag -s $GITHUB_REF_NAME" >&2
            exit 1
          fi
          verification="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$object" --jq .verification)"
          if [ "$(echo "$verification" | jq -r .verified)" != true ]; then
            echo "::error::GitHub doesn't verify the signature on $GITHUB_REF_NAME ($(echo "$verification" | jq -r .reason))" >&2
            exit 1
          fi
          # The issuer fingerprint subpacket (type 33, v4) of the armored signature.
          fpr="$(echo "$verification" | jq -r .signature | python3 -I -c '
          import base64, sys
          lines = [l.strip() for l in sys.stdin.read().splitlines()]
          body = [l for l in lines if l and not l.startswith("-----") and ":" not in l and not l.startswith("=")]
          data = base64.b64decode("".join(body))
          i = data.find(b"\x16\x21\x04")
          print(data[i + 3:i + 23].hex().upper() if i >= 0 else "")
          ')"
          case " $ALLOWED " in
            *" $fpr "*) [ -n "$fpr" ] && echo "$GITHUB_REF_NAME is signed by subkey $fpr" ;;
            *) echo "::error::$GITHUB_REF_NAME is signed by '$fpr', not by one of the maintainer's YubiKeys" >&2; exit 1 ;;
          esac

      # Only reviewed code gets signed: the tagged commit must already be on main (which takes a pull
      # request with green checks). This catches a tag put on a branch by mistake; a commit that edits this
      # file could drop the check, which is why only admins may push v* tags (the "Release tags" ruleset).
      - name: Check the tag is on main
        run: |
          git fetch --no-tags origin main
          commit="$(git rev-parse "$GITHUB_SHA^{commit}")"
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at $commit, which is not on main; merge it first, then tag" >&2
            exit 1
          fi

      - name: Import the Developer ID certificate
        if: env.HAS_P12 == 'true'
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/release.keychain-db"
          KC_PASS="$(uuidgen)"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PASS" "$KC" > /dev/null
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          ID="$(security find-identity -v -p codesigning "$KC" | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -1)"
          test -n "$ID" || { echo "no Developer ID Application identity in the certificate" >&2; exit 1; }
          echo "SIGN_IDENTITY=$ID" >> "$GITHUB_ENV"
          echo "RELEASE_KEYCHAIN=$KC" >> "$GITHUB_ENV"

      - name: Notary API key
        if: env.HAS_P12 == 'true' && env.HAS_API_KEY == 'true'
        env:
          API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          echo "$API_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          echo "NOTARY_KEY=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"

      - name: Build the DMG
        env:
          NOTARY_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: ./scripts/release.sh "$GITHUB_REF_NAME"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          set -- "$GITHUB_REF_NAME" "build/PixelPet-$VERSION.dmg" --title "Pixel Pet $VERSION" --generate-notes
          case "$VERSION" in *-*) set -- "$@" --prerelease ;; esac
          if [ -z "${SIGN_IDENTITY:-}" ]; then
            set -- "$@" --draft --prerelease --notes "Dry run: signed ad-hoc and not notarized; macOS will block it."
          fi
          gh release create "$@"

      - name: Clean up
        if: always()
        run: |
          if [ -n "${RELEASE_KEYCHAIN:-}" ]; then security delete-keychain "$RELEASE_KEYCHAIN" || true; fi
          rm -f "$RUNNER_TEMP/notary.p8"
