name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or PR supersedes the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    # The package targets macOS 26 and needs the Xcode 26 toolchain (Swift 6.2+).
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Build
        run: swift build
      - name: Test
        # The script retries the Swift Testing macro plugin hiccup seen with the Command Line Tools.
        run: ./scripts/test.sh

  bundle:
    name: Release bundle
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # git describe for CFBundleVersion
      - name: Bundle
        # No "Pixel Pet Dev" certificate on the runner: the script signs ad-hoc.
        run: ./scripts/bundle.sh
      - name: Check the bundle
        run: |
          plutil -lint build/PixelPet.app/Contents/Info.plist
          codesign --verify --strict --verbose=2 build/PixelPet.app
          file build/PixelPet.app/Contents/MacOS/PixelPet
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSUIElement' build/PixelPet.app/Contents/Info.plist)" = true

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Lint scripts
        run: shellcheck scripts/*.sh
